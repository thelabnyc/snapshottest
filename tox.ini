[tox]
toxworkdir={env:TOX_WORK_DIR:.tox}
envlist =
    py{312,313,314,315}-{pytest,unittest,nose2}
    py{312,313,314,315}-django{520,600,610}

[testenv:py{312,313,314,315}-pytest]
runner = uv-venv-runner
deps =
    pytest==9.0.2
commands =
    python -m pytest tests examples/pytest

[testenv:py{312,313,314,315}-unittest]
runner = uv-venv-runner
commands =
    python examples/unittest/test_demo.py

[testenv:py{312,313,314,315}-nose2]
runner = uv-venv-runner
deps =
    nose2==0.15.1
commands =
    python -m nose2 examples.unittest

[testenv:py{312,313,314,315}-django{520,600,610}]
runner = uv-venv-runner
deps =
    django520: django>=5.2,<5.3
    django600: django>=6.0,<6.1
    django610: django>=6.1,<6.2
allowlist_externals =
    bash
commands =
    bash -c 'cd {toxinidir}/examples/django_project && python manage.py test'
